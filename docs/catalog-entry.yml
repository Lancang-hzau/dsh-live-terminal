url: https://github.com/Lancang-hzau/dsh-live-terminal
name: Lancang-hzau/dsh-live-terminal
category: ui
description:
  en: Visible terminal panel that streams the agent's shell commands into an in-app terminal, keeps a searchable recent-command history, and lets the agent capture the screen as text, ANSI or PNG with a full wait/signal/resize/exec toolset.
  zh: 可见终端面板：把 agent 的 shell 命令实时显示在应用内终端，保留可搜索的最近命令历史，并支持 agent 以文本 / ANSI / PNG 截取屏幕，附带 wait/signal/resize/exec 等完整控制工具。
